services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data      # your PDFs live here
      - ./backend/vectordb:/app/vectordb
      - ./backend/database_data:/app/database_data  # SQLite database persistence
    environment:
      PDF_DATA_DIR: /app/data
      DB_PERSIST_DIR: /app/vectordb
      DATABASE_DIR: /app/database_data
      PYTHONUNBUFFERED: "1"
    networks:
      - riskai_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
    networks:
      - riskai_network

networks:
  riskai_network:
    driver: bridge

